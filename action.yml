name: JEV Reviewer Navigator
description: Suggest PR reviewers from CODEOWNERS, history, paths, labels, and teams. Jev decides; assignment stays explicit.
author: JevForge
branding:
  icon: users
  color: blue

inputs:
  config_path:
    description: Path to the reviewer config (allowlist, component/project maps, label→team map, required reviewers). Default `.jev/reviewer-navigator.yml`.
    required: false
    default: .jev/reviewer-navigator.yml
  changed_paths:
    description: Newline-separated list or JSON array of changed repo-relative paths. Empty collects paths from the pull request.
    required: false
    default: ''
  codeowners_path:
    description: Preferred CODEOWNERS path. Also searches `docs/CODEOWNERS` and `.github/CODEOWNERS`.
    required: false
    default: CODEOWNERS
  allowlist:
    description: Extra users and teams (`team:slug`) that may be suggested. Merged with the config allowlist.
    required: false
    default: ''
  exclude_author:
    description: Exclude the pull request author from suggestions.
    required: false
    default: 'true'
  max_reviewers:
    description: Maximum number of reviewers to suggest (1–16).
    required: false
    default: '3'
  labels:
    description: PR labels used as evidence. Empty reads labels from the `pull_request` event.
    required: false
    default: ''
  affected_projects:
    description: Newline-separated list or JSON array of monorepo projects affected by the change.
    required: false
    default: ''
  monorepo_plan:
    description: JSON plan from JEV Monorepo Navigator. Reads its `affected_projects` field.
    required: false
    default: ''
  jev_provider:
    description: Jev access provider — `vercel-ai-gateway` (default), `typesafe-native`, or `custom-compatible`. No silent fallback.
    required: false
    default: ''
  jev_model:
    description: Model id. Gateway defaults to `typesafe-ai/jev`. Native and custom providers require a catalog model id.
    required: false
    default: ''
  jev_endpoint:
    description: HTTPS evaluate endpoint for `typesafe-native` or `custom-compatible`. Repo config is ignored unless `trust_repo_jev_endpoint` is true.
    required: false
    default: ''
  jev_timeout_ms:
    description: Provider timeout in milliseconds (1000–120000).
    required: false
    default: '45000'
  jev_config_path:
    description: Shared `.jev/config.yml` path for provider defaults.
    required: false
    default: .jev/config.yml
  min_confidence:
    description: Minimum Jev confidence (0–1) required before `RECOMMEND_REVIEWERS` is trusted. Empty uses config or `0.6`.
    required: false
    default: ''
  low_confidence_policy:
    description: Policy when Jev is unavailable, schema-rejected, or below `min_confidence` — `fail`, `warn`, `request-review`, or `no-op`.
    required: false
    default: ''
  decision_only:
    description: When true (default), only emit recommendations. Never assigns reviewers.
    required: false
    default: 'true'
  assign_reviewers:
    description: 'When true and `decision_only` is false, request suggested reviewers on the PR. Requires `pull-requests: write`.'
    required: false
    default: 'false'
  auto_assign:
    description: Documents always-on assign workflows. Still requires `decision_only=false` and `assign_reviewers=true`.
    required: false
    default: 'false'
  consider_availability:
    description: Soft-signal org membership when a token is available. Never invents busy or OOO status.
    required: false
    default: 'false'
  consider_review_load:
    description: Soft-signal open review-request counts via the GitHub API when a token is available.
    required: false
    default: 'false'
  include_commit_history:
    description: Include recent commit authors for changed paths as evidence.
    required: false
    default: 'true'
  history_lookback:
    description: Maximum commits to scan per path batch (1–50).
    required: false
    default: '20'
  comment_on_github:
    description: 'Upsert an idempotent PR comment. Requires `pull-requests: write`.'
    required: false
    default: 'false'
  create_check_run:
    description: 'Create a completed Check Run named JEV Reviewer Navigator. Requires `checks: write`.'
    required: false
    default: 'false'
  telemetry:
    description: Emit one structured JSON info log with duration and counts (no paths or secrets).
    required: false
    default: 'false'
  cache_decisions:
    description: When true, restore/save the typed decision via the Actions cache (keyed by SHA, config, paths, provider).
    required: false
    default: 'false'
  trust_repo_jev_endpoint:
    description: Allow `jev_endpoint` from repository config to receive credentials. Keep false unless that file is CODEOWNERS-protected.
    required: false
    default: 'false'
  token:
    description: Token for PR files, history, soft signals, and optional assign/comment/check effects. Prefer `${{ github.token }}`.
    required: false
    default: ${{ github.token }}
  dry_run:
    description: When true (default), emit outputs but do not assign, post comments, or fail the step on policy `fail`.
    required: false
    default: 'true'

outputs:
  decision:
    description: Final decision — `RECOMMEND_REVIEWERS`, `ABSTAIN`, or `REQUEST_REVIEW`.
  suggested_reviewers:
    description: JSON array of allowlisted logins and `team:slug` values.
  ranked_reviewers:
    description: JSON array of suggested reviewers in preference order.
  primary_reviewer:
    description: First ranked reviewer, or empty when no reviewer is recommended.
  confidence:
    description: Jev confidence from 0 to 1. Policy overrides do not invent a higher value.
  reason_codes:
    description: JSON array of stable reason codes (for example `CODEOWNERS_HIT`, `LOW_CONFIDENCE`).
  summary:
    description: Plain-text explanation for humans and logs. Never execute this string.
  provisional:
    description: '`true` when the result came from deterministic policy rather than a trusted Jev selection.'
  needs_review:
    description: '`true` when the request-review policy applied.'
  affected_paths:
    description: JSON array of normalized changed paths collected by the Action.
  jev_provider:
    description: Provider that was asked. The Action never falls back to a different provider.
  assign_status:
    description: Assignment effect — `requested`, `unchanged`, `dry-run`, `skipped`, or `disabled`.
  availability_status:
    description: Soft availability collection — `collected`, `skipped`, or `unavailable`.
  load_metrics:
    description: JSON object of per-candidate open review-request counts (empty when disabled).
  cache_hit:
    description: '`true` when the decision was restored from the Actions cache.'

runs:
  using: node24
  main: dist/index.js
