name: E2E fixture

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-pull-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/e2e/fixture.test.ts --reporter=verbose
