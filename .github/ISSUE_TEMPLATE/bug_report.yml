name: Bug report
description: Report a problem with JEV Reviewer Navigator
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug.

        **Do not include API keys, tokens, credentials, or other secrets.**
        Redact log lines that might contain secrets before pasting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Action version
      description: For example v0.1.0 or a commit SHA
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow snippet
      description: Relevant YAML only. Redact secrets.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant Action logs with secrets removed.
      render: shell
  - type: dropdown
    id: decision
    attributes:
      label: decision output (if known)
      options:
        - unknown
        - RECOMMEND_REVIEWERS
        - ABSTAIN
        - REQUEST_REVIEW
  - type: input
    id: provisional
    attributes:
      label: provisional output (if known)
      placeholder: true / false
