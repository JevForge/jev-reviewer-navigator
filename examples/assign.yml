name: Reviewer Navigator (assign)

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  assign-reviewers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: nav
        uses: JevForge/jev-reviewer-navigator@v0
        with:
          decision_only: 'false'
          assign_reviewers: 'true'
          auto_assign: 'true'
          dry_run: 'false'
          consider_availability: 'true'
          consider_review_load: 'true'
          comment_on_github: 'true'
          create_check_run: 'true'
          max_reviewers: '3'
          low_confidence_policy: request-review
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}

      - name: Stop when selection needs human review
        if: steps.nav.outputs.needs_review == 'true'
        run: |
          echo "Reviewer selection requires human review"
          exit 1

      - name: Confirm assignment
        if: steps.nav.outputs.assign_status == 'requested'
        run: echo "Assigned ${{ steps.nav.outputs.suggested_reviewers }}"
